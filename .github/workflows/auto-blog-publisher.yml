name: Auto Publish SEO Blogs (3-4x Weekly)

on:
  schedule:
    # Runs 4 times per week: Monday, Wednesday, Friday, Sunday at 09:00 UTC
    - cron: '0 9 * * 0,1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate country-targeted SEO blog post
        run: python scripts/auto_publish_blogs.py

      - name: Set up Node.js & verify Astro build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & build check
        run: |
          npm ci
          ASTRO_TELEMETRY_DISABLED=1 npm run build

      - name: Commit and push new SEO blog
        run: |
          git config user.name "BeeDND Editorial Bot"
          git config user.email "bot@beednd.com"
          git add src/content/blog
          if git diff --staged --quiet; then
            echo "No new blog generated in this run."
          else
            git commit -m "chore(blog-bot): publish country-targeted SEO guide"
            git push
          fi
